<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Reader</title>

<style>
body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    margin:0;
    padding:10px;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    background:#121212;
    color:#e0e0e0;
}

.form-container{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    width:100%;
}

input,
button{
    padding:10px;
    font-size:16px;
    background:#333;
    border:1px solid #444;
}

input[type="text"]{
    flex:1;
    min-width:150px;
    color:#fff;
}

button{
    cursor:pointer;
    color:#fff;
}

.color-picker{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

#hasil{
    margin-top:20px;
    white-space:pre-wrap;
    font-family:monospace;
    background:linear-gradient(to bottom,#444 20%,#333 20%);
    color:#fff;
    padding:10px;
    border-radius:4px;
    font-size:15px;
    max-height:70vh;
    overflow-y:auto;
}

.loading-overlay{
    position:fixed;
    inset:0;
    background:rgba(18,18,18,.85);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.spinner{
    width:60px;
    height:60px;
    border:6px solid #333;
    border-top:6px solid #aaa;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="form-container">

    <input
        type="text"
        id="urlInput"
        placeholder="Masukkan URL..."
    >

    <button onclick="ambilTeks()">Get</button>

    <div class="color-picker">

        <input
            type="color"
            id="textColor"
            value="#ffffff"
            onchange="ubahWarnaTeks(event)"
        >

        <input
            type="color"
            id="bgTopColor"
            value="#444444"
            onchange="ubahGradient()"
        >

        <input
            type="color"
            id="bgBottomColor"
            value="#333333"
            onchange="ubahGradient()"
        >

    </div>

</div>

<div id="hasil">
Masukkan URL lalu klik Get.
</div>

<div
    id="loadingOverlay"
    class="loading-overlay"
    style="display:none"
>
    <div class="spinner"></div>
</div>

<script>

async function fetchDenganFallback(url){

    const proxies = [

        {
            nama:"AllOrigins",
            url:(u)=>
                `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
        },

        {
            nama:"CorsProxy",
            url:(u)=>
                `https://corsproxy.io/?${encodeURIComponent(u)}`
        },

        {
            nama:"CodeTabs",
            url:(u)=>
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
        }

    ];

    const daftarError = [];

    for(const proxy of proxies){

        try{

            const proxyUrl = proxy.url(url);

            const response = await fetch(proxyUrl);

            if(!response.ok){

                let body = "";

                try{
                    body = await response.text();
                }catch{
                    body = "(Tidak ada response body)";
                }

                daftarError.push(
`PROXY  : ${proxy.nama}
STATUS : ${response.status} ${response.statusText}
URL    : ${proxyUrl}

RESPONSE:
${body}`
                );

                continue;
            }

            return await response.text();

        }catch(err){

            daftarError.push(
`PROXY  : ${proxy.nama}
STATUS : FETCH ERROR
URL    : ${proxy.url(url)}

PESAN:
${err.message}`
            );

        }

    }

    throw new Error(
        daftarError.join(
`\n\n====================================================\n\n`
        )
    );

}

async function ambilTeks(){

    const hasil = document.getElementById("hasil");
    const url = document.getElementById("urlInput").value.trim();

    if(!url){

        hasil.innerText = "URL tidak boleh kosong.";
        return;

    }

    document.getElementById("loadingOverlay").style.display = "flex";

    try{

        hasil.innerText = "Mengambil data...";

        const htmlContent = await fetchDenganFallback(url);

        const parser = new DOMParser();

        const doc = parser.parseFromString(
            htmlContent,
            "text/html"
        );

        const pElements =
            doc.querySelectorAll("article p");

        const aElements =
            doc.querySelectorAll(
                ".main-pagination a, .navigate-posts a"
            );

        let combinedText = "";

        pElements.forEach(p=>{

            combinedText +=
                p.innerText + "\n\n";

        });

        aElements.forEach(a=>{

            const href =
                a.getAttribute("href");

            if(
                href &&
                href.includes("ngocoks.com/")
            ){

                combinedText +=
                    `${a.innerText} → ${href}\n\n`;

            }

        });

        if(!combinedText.trim()){

            combinedText =
`Halaman berhasil diambil.

Tetapi selector berikut tidak menemukan data:

article p`;

        }

        hasil.innerText = combinedText;

    }
    catch(error){

        hasil.innerText =
`❌ GAGAL MENGAMBIL DATA

${error.message}`;

    }
    finally{

        document.getElementById(
            "loadingOverlay"
        ).style.display = "none";

    }

}

function ubahWarnaTeks(event){

    document.getElementById("hasil")
        .style.color = event.target.value;

}

function ubahGradient(){

    const atas =
        document.getElementById(
            "bgTopColor"
        ).value;

    const bawah =
        document.getElementById(
            "bgBottomColor"
        ).value;

    document.getElementById("hasil")
        .style.background =
        `linear-gradient(
            to bottom,
            ${atas} 20%,
            ${bawah} 20%
        )`;

}
</script>

</body>
</html>
